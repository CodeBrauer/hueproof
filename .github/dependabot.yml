version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        # apca-w3 stays out of the group so its updates arrive as their own PRs.
        exclude-patterns:
          - "apca-w3"
        update-types:
          - minor
          - patch
    ignore:
      # @types/node follows the Node major the site runs on (24, see ci.yml). Raise both together.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
