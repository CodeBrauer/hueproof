version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        # apca-w3 stays out of the group so its updates arrive as their own PRs.
        exclude-patterns:
          - "apca-w3"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
